name: Sync books

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a full sync and redeploy even when upstream is unchanged"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: devshelf-sync-and-pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE: ${{ inputs.force }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check upstream repository for changes
        id: check
        run: |
          set -euo pipefail
          mkdir -p .cache
          extra=""
          if [ "$FORCE" = "true" ]; then extra="--force"; fi
          npm run sync:check -- $extra | tee .cache/sync-check.log
          grep '^CHANGED=' .cache/sync-check.log >> "$GITHUB_OUTPUT"
          grep '^UPSTREAM_COMMIT=' .cache/sync-check.log >> "$GITHUB_OUTPUT"

      - name: Synchronize catalog from upstream commit
        id: sync
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          set -euo pipefail
          extra=""
          if [ "$FORCE" = "true" ]; then extra="--force"; fi
          npm run sync -- $extra

      - name: Validate generated data
        run: npm run validate:data

      - name: Test parser and check types
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          npm test
          npm run typecheck

      - name: Commit new dataset
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/content scripts/reports
          if git diff --cached --quiet; then
            echo "No tracked data changes to commit."
          else
            git commit -m "chore: sync book catalog (${{ steps.check.outputs.UPSTREAM_COMMIT }})"
            git push
          fi

      - name: Build static website
        if: steps.check.outputs.CHANGED == 'true'
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload Pages artifact
        if: steps.check.outputs.CHANGED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.check.outputs.CHANGED == 'true'
        uses: actions/deploy-pages@v4

      - name: Success summary
        if: success() && steps.check.outputs.CHANGED == 'false'
        run: |
          echo "### DevShelf sync: no changes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream is unchanged. Validation passed; the existing deployment was kept." >> "$GITHUB_STEP_SUMMARY"

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "### DevShelf sync failed"
            echo ""
            if [ -f scripts/reports/sync-error.md ]; then
              cat scripts/reports/sync-error.md
            else
              echo "See the job log for details."
            fi
            echo ""
            echo "The last known good dataset and the existing deployment were left untouched."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload error report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-error
          path: scripts/reports/sync-error.md
          if-no-files-found: ignore
