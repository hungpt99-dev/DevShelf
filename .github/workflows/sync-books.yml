name: Sync books

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a full sync and redeploy even when upstream is unchanged"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: devshelf-sync-and-pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE: ${{ inputs.force }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check upstream repository for changes
        id: check
        run: |
          set -euo pipefail
          mkdir -p .cache
          extra=""
          if [ "$FORCE" = "true" ]; then extra="--force"; fi
          npm run sync:check -- $extra | tee .cache/sync-check.log
          grep '^CHANGED=' .cache/sync-check.log >> "$GITHUB_OUTPUT"
          grep '^UPSTREAM_COMMIT=' .cache/sync-check.log >> "$GITHUB_OUTPUT"

      - name: Synchronize catalog from upstream commit
        id: sync
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          set -euo pipefail
          extra=""
          if [ "$FORCE" = "true" ]; then extra="--force"; fi
          npm run sync -- $extra

      - name: Fetch book covers
        id: covers
        run: |
          set -uo pipefail
          npm run sync:covers -- --limit 200 --delay 1000 | tee .cache/covers.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "Cover fetch failed; keeping the last known good cover and metadata files." | tee -a .cache/covers.log
          fi
          grep '^CHANGED=' .cache/covers.log >> "$GITHUB_OUTPUT" || echo 'CHANGED=false' >> "$GITHUB_OUTPUT"

      - name: Validate generated data
        run: npm run validate:data

      - name: Test parser and check types
        if: steps.check.outputs.CHANGED == 'true' || steps.covers.outputs.CHANGED == 'true'
        run: |
          npm test
          npm run typecheck

      - name: Commit new dataset
        if: steps.check.outputs.CHANGED == 'true' || steps.covers.outputs.CHANGED == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/content scripts/reports scripts/cache
          if git diff --cached --quiet; then
            echo "No tracked data changes to commit."
          else
            git commit -m "chore: sync book catalog (${{ steps.check.outputs.UPSTREAM_COMMIT }})"
            git push
          fi

      - name: Build static website
        if: steps.check.outputs.CHANGED == 'true' || steps.covers.outputs.CHANGED == 'true'
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload Pages artifact
        if: steps.check.outputs.CHANGED == 'true' || steps.covers.outputs.CHANGED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.check.outputs.CHANGED == 'true' || steps.covers.outputs.CHANGED == 'true'
        uses: actions/deploy-pages@v4

      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — Cloudflare deploy skipped."
          fi

      # Cloudflare serves from the site root, so rebuild without the Pages subpath.
      - name: Build for Cloudflare (root path)
        if: (steps.check.outputs.CHANGED == 'true' || steps.covers.outputs.CHANGED == 'true') && steps.cloudflare.outputs.enabled == 'true'
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        if: (steps.check.outputs.CHANGED == 'true' || steps.covers.outputs.CHANGED == 'true') && steps.cloudflare.outputs.enabled == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create devshelf-hungpt99 --production-branch main

      - name: Deploy to Cloudflare Pages
        id: cloudflare_deploy
        if: (steps.check.outputs.CHANGED == 'true' || steps.covers.outputs.CHANGED == 'true') && steps.cloudflare.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=devshelf-hungpt99 --branch=main

      - name: Cloudflare summary
        if: steps.cloudflare_deploy.outputs.deployment-url != ''
        run: |
          echo "Cloudflare Pages: ${{ steps.cloudflare_deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Success summary
        if: success() && steps.check.outputs.CHANGED == 'false'
        run: |
          echo "### DevShelf sync: no changes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream is unchanged. Validation passed; the existing deployment was kept." >> "$GITHUB_STEP_SUMMARY"

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "### DevShelf sync failed"
            echo ""
            if [ -f scripts/reports/sync-error.md ]; then
              cat scripts/reports/sync-error.md
            else
              echo "See the job log for details."
            fi
            echo ""
            echo "The last known good dataset and the existing deployment were left untouched."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload error report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-error
          path: scripts/reports/sync-error.md
          if-no-files-found: ignore
